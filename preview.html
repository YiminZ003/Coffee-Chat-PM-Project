function home(){el.innerHTML=nav('home')+`<main><section class="hero"><div class="container hero-grid"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-dot"></span> MADE FOR CURIOUS MINDS AT U OF T</div><h1>The next big thing starts with a <em>little hello.</em></h1><p>You have questions. Someone has been there. Find your people, start a conversation, and turn “I should reach out” into “I’m glad I did.”</p><div class="hero-actions"><a href="#onboarding" class="btn btn-primary btn-large">Find your people ${icon('arrow')}</a><a class="link-text" href="#how-it-works">See how it works ${icon('arrow')}</a></div><div class="hero-trust"><div class="avatar-stack">${people.slice(0,4).map(p=>avatar(p,'sm')).join('')}</div><span>Meaningful connections, without the awkward first step.</span></div></div><div class="hero-art"><div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div><div class="hero-asterisk">✳</div><div class="hero-person hero-person-one">${avatar(people[0],'xl')}</div><div class="hero-person hero-person-two">${avatar(people[1],'xl')}</div><div class="hero-person hero-person-three">${avatar(people[2],'xl')}</div><div class="floating-label floating-label-top"><span class="glow-circle">${icon('sparkles')}</span>It starts with a connection</div><div class="floating-label floating-label-bottom"><span class="green-status"></span> Available for coffee chats ${icon('heart')}</div><div class="hero-visual-caption">GOOD CONVERSATIONS<br>GO PLACES ↗</div></div></div></section><section class="marquee-strip"><div class="container marquee-inner"><span>FIND YOUR PEOPLE</span><i>✳</i><span>GROW YOUR CIRCLE</span><i>✳</i><span>ASK BETTER QUESTIONS</span><i>✳</i><span>MAKE IT HAPPEN</span></div></section><section class="section" id="how-it-works"><div class="container"><div class="section-heading"><div><div class="eyebrow">HOW IT WORKS</div><h2>Networking, minus<br><em>the guesswork.</em></h2></div><p>We make the hardest part of making a new connection feel surprisingly simple.</p></div><div class="steps-grid">${[['01 / TELL US ABOUT YOU','Make it yours','Tell us your program, interests, and what you’re curious about.','peach','graduation'],['02 / FIND YOUR PEOPLE','Meet your people','Explore students and alumni by industry, program and graduation year.','lavender','users'],['03 / BREAK THE ICE','Say hello with confidence','Get a thoughtful introduction and personalized conversation starters.','mint','sparkles']].map(x=>`<div class="step-card step-${x[3]}"><span class="step-num">${x[0]}</span><div class="step-icon">${icon(x[4],29)}</div><h3>${x[1]}</h3><p>${x[2]}</p><div class="step-foot">Let’s make it happen ${icon('arrow')}</div></div>`).join('')}</div></div></section><section class="feature-section"><div class="container feature-grid"><div class="feature-visual"><div class="feature-stamp">A LITTLE<br>LESS AWKWARD <span>✳</span></div><div class="feature-demo-card"><div class="micro-label">YOUR POTENTIAL CONNECTION</div><div class="feature-demo-person">${avatar(people[0],'lg')}<div><strong>Sofia Chen</strong><span>Product Manager · Rotman alum</span></div></div><div class="feature-demo-line"></div><div class="micro-label">MADE FOR YOU ${icon('sparkles',14)}</div><p>“I noticed your background in product management and would love to learn how you got started…”</p><div class="feature-demo-action">An introduction that sounds like you ${icon('arrow')}</div></div></div><div class="feature-copy"><div class="eyebrow">GOODBYE, COLD INTRODUCTIONS</div><h2>Big ideas begin with <em>real people.</em></h2><p>You don’t need to have it all figured out. Whether you’re curious about a career, exploring a new industry, or looking for a familiar face, we’ll help you take the first step.</p><div class="feature-points"><div>${icon('check')} Discover relevant connections</div><div>${icon('check')} Get context before reaching out</div><div>${icon('check')} Have better first conversations</div></div><a href="#onboarding" class="btn btn-dark">Start exploring ${icon('arrow')}</a></div></div></section><section class="closing-section"><div class="container closing-inner"><div class="eyebrow">YOUR NEXT CHAPTER IS CALLING</div><h2>One coffee.<br><em>A whole lot of possibility.</em></h2><p>Find someone worth talking to. We’ll help with the hello.</p><a href="#onboarding" class="btn btn-primary btn-large">Let’s connect ${icon('arrow')}</a></div></section></main>`+footer();window.scrollTo(0,0)}
function form(edit){el.innerHTML=nav('me')+banner()+`<main class="inner-page onboarding-page"><div class="container form-shell"><div class="form-top"><span class="form-counter">${edit?'YOUR ACCOUNT':'01 / THE INTRODUCTION'}</span><div class="form-illustration">${icon('sparkles',35)}</div><div class="eyebrow">${edit?'UPDATE YOUR DETAILS':'A LITTLE ABOUT YOU'}</div><h1>${edit?'Your story, <em>your way.</em>':'Let’s get to <em>know you.</em>'}</h1><p>A few details help you find people who share your interests and understand your goals.</p></div><form id="profile-form" class="profile-form"><div class="form-columns"><div class="form-field"><label>Your full name</label><input name="name" maxlength="90" required value="${esc(profile.name)}"></div><div class="form-field"><label>I’m a...</label><select name="type"><option value="student" ${profile.type==='student'?'selected':''}>Current student</option><option value="alumni" ${profile.type==='alumni'?'selected':''}>Alumni</option></select></div><div class="form-field"><label>Program</label><select name="program">${['Rotman MMA','Rotman Commerce','Computer Science','Engineering','Economics','Public Health'].map(x=>`<option ${x===profile.program?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-field"><label>Class year</label><input name="class_year" type="number" min="1950" max="2100" required value="${esc(profile.class_year)}"></div><div class="form-field"><label>Industry of interest</label><select name="industry">${['Technology','Consulting','Finance','Healthcare','Marketing','Sustainability'].map(x=>`<option ${x===profile.industry?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-field"><label>Current role or goal</label><input name="role" value="${esc(profile.role)}"></div></div><div class="form-field"><label>What are you curious about?</label><input name="interests" value="${esc(profile.interests.join(', '))}"><span class="form-helper">Separate with commas.</span></div><div class="form-field"><label>What would you like from a coffee chat?</label><textarea name="chat_goal" rows="3" required>${esc(profile.chat_goal)}</textarea></div><label class="switch-row"><span><strong>Open to coffee chats</strong><small>Let other U of T members discover your profile.</small></span><input type="checkbox" name="open_to_chats" ${profile.open_to_chats?'checked':''}><span class="switch-track"></span></label><div class="form-bottom"><span>✳ Your demo profile stays in this browser.</span><button class="btn btn-primary">${edit?'Save changes':'Find my people'} ${icon('arrow')}</button></div></form></div></main>`+footer();document.getElementById('profile-form').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);profile={...profile,name:String(f.get('name')).trim(),type:f.get('type'),program:f.get('program'),class_year:Number(f.get('class_year')),industry:f.get('industry'),role:f.get('role'),interests:String(f.get('interests')).split(',').map(x=>x.trim()).filter(Boolean),chat_goal:f.get('chat_goal'),open_to_chats:!!f.get('open_to_chats')};localStorage.setItem('coffee-chats-preview-profile',JSON.stringify(profile));location.hash='people';});window.scrollTo(0,0)}
const options=(vals,selected,all)=>`<option value="all">${all}</option>`+[...new Set(vals)].sort().map(x=>`<option value="${esc(x)}" ${selected===String(x)?'selected':''}>${esc(x)}</option>`).join('');
function directory(){el.innerHTML=nav('people')+banner()+`<main><section class="directory-hero"><div class="container directory-hero-grid"><div><div class="eyebrow"><span class="eyebrow-dot"></span> YOUR NETWORK STARTS HERE</div><h1>Find people worth <em>talking to.</em></h1><p>Great conversations don’t happen by accident. Explore people with shared interests, new perspectives, and stories worth hearing.</p><div class="directory-stat"><div class="stat-dots"><span></span><span></span><span></span></div><strong>${people.length}</strong> people open to conversations</div></div><div class="directory-illustration"><div class="mini-orbit one"></div><div class="mini-orbit two"></div><div class="directory-avatar one">${avatar(people[0])}</div><div class="directory-avatar two">${avatar(people[1])}</div><div class="directory-avatar three">${avatar(people[2])}</div><div class="directory-spark">✳</div><div class="directory-floating">${icon('sparkles',15)} Say hello to someone new</div></div></div></section><section class="directory-content container"><div class="directory-tabs"><div class="tabs" role="group"><button data-tab="all" class="${filters.tab==='all'?'selected':''}">Everyone <span>${people.length}</span></button><button data-tab="alumni" class="${filters.tab==='alumni'?'selected':''}">Alumni <span>${people.filter(x=>x.type==='alumni').length}</span></button><button data-tab="student" class="${filters.tab==='student'?'selected':''}">Students <span>${people.filter(x=>x.type==='student').length}</span></button></div><span class="directory-tab-hint">${icon('heart',15)} Good conversations welcome</span></div><div class="filter-bar"><div class="search-field">${icon('search',20)}<input id="search" placeholder="Search names, roles, interests…" value="${esc(filters.query)}" aria-label="Search people"></div><label class="filter-select"><span>INDUSTRY</span><select id="industry" aria-label="Industry">${options(people.map(x=>x.industry),filters.industry,'All industries')}</select></label><label class="filter-select"><span>PROGRAM</span><select id="program" aria-label="Program">${options(people.map(x=>x.program),filters.program,'All programs')}</select></label><label class="filter-select"><span>CLASS YEAR</span><select id="year" aria-label="Class year">${options(people.map(x=>x.class_year),filters.year,'Any year')}</select></label></div><div class="result-toolbar"><div><h2>Meet the community <span id="count"></span></h2><p>People who are up for a good coffee chat.</p></div><div class="result-actions"><button class="clear-btn" id="clear">Reset filters</button><label class="sort-wrap">Sort by <select id="sort"><option value="relevant">Recommended</option><option value="newest">Newest class first</option><option value="oldest">Oldest class first</option></select></label></div></div><div class="people-grid" id="cards"></div><div class="discovery-bottom"><div><span>✳</span><strong>Sometimes the best connection is unexpected.</strong><p>Try exploring outside your usual industry or program.</p></div><a class="btn btn-outline" href="#me">Update my interests ${icon('arrow')}</a></div></section></main>`+footer();document.getElementById('sort').value=filters.sort;
 for(let key of ['query','industry','program','year','sort']){let id=key==='query'?'search':key;document.getElementById(id).addEventListener(key==='query'?'input':'change',e=>{filters[key]=e.target.value;updateCards();});}
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{filters.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===b));updateCards()}));
 document.getElementById('clear').addEventListener('click',()=>{filters={tab:'all',query:'',industry:'all',program:'all',year:'all',sort:'relevant'};directory()});updateCards();window.scrollTo(0,0)}
function updateCards(){let found=people.filter(p=>(filters.tab==='all'||filters.tab===p.type)&&(filters.industry==='all'||filters.industry===p.industry)&&(filters.program==='all'||filters.program===p.program)&&(filters.year==='all'||filters.year===String(p.class_year))&&(!filters.query||[p.name,p.role,p.program,p.industry,...p.interests].join(' ').toLowerCase().includes(filters.query.toLowerCase()))).sort((a,b)=>filters.sort==='newest'?b.class_year-a.class_year:filters.sort==='oldest'?a.class_year-b.class_year:Number(b.industry===profile.industry)-Number(a.industry===profile.industry)||b.class_year-a.class_year);
 document.getElementById('count').textContent=`(${found.length})`;
 document.getElementById('cards').innerHTML=found.map(p=>`<a class="person-card" href="#profile/${p.id}"><div class="person-card-top"><span class="member-badge ${p.type}">${p.type==='alumni'?'ALUMNI':'CURRENT STUDENT'}</span>${p.industry===profile.industry?'<span class="match-chip">✳ Shared industry</span>':''}</div><div class="person-card-main">${avatar(p)}<div><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p></div></div><div class="person-card-meta"><span>${icon('graduation',15)} ${esc(p.program)}</span><span>${icon('calendar',15)} Class of ${p.class_year}</span></div><div class="card-interest-list">${p.interests.slice(0,3).map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="person-card-footer"><span>Fictional sample profile</span><strong>View profile ${icon('arrow',17)}</strong></div></a>`).join('')||`<div class="empty-state" style="grid-column:1/-1"><h3>No connections found yet.</h3><p>Try another search term, program, or industry.</p><button class="btn btn-dark" onclick="filters={tab:'all',query:'',industry:'all',program:'all',year:'all',sort:'relevant'};directory()">Reset filters</button></div>`;}
function detail(id){const p=people.find(x=>x.id===id);if(!p){location.hash='people';return}el.innerHTML=nav('people')+banner()+`<main class="inner-page"><div class="container"><div class="profile-back"><a href="#people" class="text-back">${icon('back')} Back to discovery</a></div><div class="detail-grid"><div class="detail-primary"><div class="detail-heading"><div class="detail-avatar-wrap">${avatar(p,'xl')}</div><div class="detail-heading-copy"><div class="eyebrow">MEET YOUR POTENTIAL CONNECTION</div><h1>${esc(p.name)}</h1><p>${esc(p.role)}</p><div class="detail-badges"><span class="member-badge ${p.type}">${p.type==='alumni'?'U OF T ALUMNI':'CURRENT STUDENT'}</span><span class="open-badge"><span></span> Open to chats</span></div></div></div><div class="detail-information"><div class="detail-info-row"><div class="info-icon">${icon('graduation',21)}</div><div><small>Education</small><strong>${esc(p.program)} · Class of ${p.class_year}</strong></div></div><div class="detail-info-row"><div class="info-icon">${icon('briefcase',21)}</div><div><small>Industry</small><strong>${esc(p.industry)}</strong></div></div><div class="detail-info-row"><div class="info-icon">${icon('message',21)}</div><div><small>Why they're here</small><strong>${esc(p.chat_goal)}</strong></div></div></div><div class="detail-interests"><h3>A few things they're into</h3><div class="card-interest-list">${p.interests.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><p class="detail-disclaimer">Fictional sample profile; not a real person available to contact.</p></div><aside class="detail-aside"><div class="ai-panel"><div class="ai-panel-header"><div class="ai-icon">${icon('sparkles',24)}</div><span class="ai-label">YOUR CONVERSATION CO-PILOT</span></div><h2>Not sure what to <em>say?</em></h2><p>We'll help you find common ground, write a warm introduction, and get the conversation flowing.</p><div class="ai-list"><span>${icon('check')} Why you might connect</span><span>${icon('check')} A natural opening message</span><span>${icon('check')} 3–5 thoughtful questions</span></div><button class="btn btn-primary btn-full" id="generate">Generate my introduction ${icon('sparkles',18)}</button><small class="ai-privacy">This offline preview shows template text, not a live AI request.</small></div></aside></div><div id="suggestions"></div></div></main>`+footer();document.getElementById('generate').addEventListener('click',()=>{let common=profile.interests.find(i=>p.interests.some(j=>j.toLowerCase()===i.toLowerCase()));let reason=`${p.name} has experience in ${p.industry.toLowerCase()}${common?' and shares your interest in '+common.toLowerCase():''}. Their background in ${p.program} could offer a useful perspective on your career interests.`;let message=`Hi ${p.name.split(' ')[0]}! I'm ${profile.name}, a ${profile.program} ${profile.type==='student'?'student':'alum'} exploring ${profile.industry.toLowerCase()}. I came across your profile and was interested in your experience as a ${p.role}. If you're open to it, I'd love to hear about your path over a short coffee chat. Thanks for considering it!`;let questions=[`What led you into ${p.industry.toLowerCase()}?`,`Which early experiences helped you most?`,`What would you suggest to a ${profile.program} student looking to learn more?`,`What's something you wish you'd known at U of T?`];document.getElementById('suggestions').innerHTML=`<section class="suggestions"><div class="suggestions-title"><div><div class="eyebrow">✳ CONVERSATION STARTER KIT</div><h2>Your next hello, <em>made easier.</em></h2></div><span class="results-mode">Template preview — not AI</span></div><div class="suggestion-box"><div class="suggestion-marker">01</div><div><h3>Why this connection makes sense</h3><p>${esc(reason)}</p></div></div><div class="suggestion-box"><div class="suggestion-marker">02</div><div class="suggestion-copy"><h3>A message to break the ice</h3><p class="message-result">${esc(message)}</p><button id="copy" class="btn btn-outline btn-small">Copy message</button></div></div><div class="suggestion-box"><div class="suggestion-marker">03</div><div><h3>Questions worth asking</h3><ol class="questions-list">${questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div></div><p class="ai-caution">Personalize the draft before sending. The prototype does not send real invitations.</p></section>`;document.getElementById('copy').addEventListener('click',()=>navigator.clipboard?.writeText(message).then(()=>document.getElementById('copy').textContent='Copied!').catch(()=>document.getElementById('copy').textContent='Select and copy the message'));document.getElementById('suggestions').scrollIntoView({behavior:'smooth'})});window.scrollTo(0,0)}
function route(){const path=location.hash.slice(1)||'home';if(path==='onboarding')form(false);else if(path==='me')form(true);else if(path==='people')directory();else if(path.startsWith('profile/'))detail(path.split('/')[1]);else if(path==='how-it-works'){home();setTimeout(()=>document.getElementById('how-it-works')?.scrollIntoView({behavior:'smooth'}),50)}else home();}
window.addEventListener('hashchange',route);route();
</script></body></html>
